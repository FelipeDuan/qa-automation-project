[pytest]
markers =
    smoke: Smoke tests (critical paths)
    pet: Pet API tests
    user: User API tests
    store: Store API tests
    negative: Negative test scenarios
    e2e: End-to-end test scenarios
    login: Login test scenarios
    checkout: Checkout test scenarios

addopts = -v --tb=short --strict-markers
testpaths = api/tests web/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
